name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false   # 依存パッケージが0個で go.sum がないため

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt が必要なファイル:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

      - name: コマンドが動くこと
        run: |
          go run ./cmd/symmatinv show -n 3
          go run ./cmd/symmatinv verify -n 6 -exact
          go run ./cmd/symmatinv plan -n 8
